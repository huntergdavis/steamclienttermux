<!doctype html>
<meta charset="utf-8">
<title>PENDING</title>
<pre id="result">RESULT=PENDING</pre>
<script>
(async () => {
  const checks = {
    arithmetic: false,
    promise: false,
    wasm: false,
    fetch: false,
    timer: false,
  };

  let sum = 0;
  for (let index = 0; index < 100000; ++index) sum += index;
  checks.arithmetic = sum === 4999950000;

  await Promise.resolve();
  checks.promise = true;

  const wasm = new Uint8Array([
    0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
    0x01, 0x05, 0x01, 0x60, 0x00, 0x01, 0x7f,
    0x03, 0x02, 0x01, 0x00,
    0x07, 0x0a, 0x01, 0x06, 0x61, 0x6e, 0x73, 0x77, 0x65, 0x72, 0x00, 0x00,
    0x0a, 0x06, 0x01, 0x04, 0x00, 0x41, 0x2a, 0x0b,
  ]);
  const module = await WebAssembly.instantiate(wasm);
  checks.wasm = module.instance.exports.answer() === 42;

  const response = await fetch("data:text/plain,fetch-pass");
  checks.fetch = await response.text() === "fetch-pass";

  setTimeout(() => {
    checks.timer = true;
    const pass = Object.values(checks).every(Boolean);
    document.title = pass ? "PASS" : "FAIL";
    document.querySelector("#result").textContent =
      `RESULT=${pass ? "PASS" : "FAIL"}\n` +
      Object.entries(checks).map(([name, value]) => `${name}=${Number(value)}`).join("\n");
  }, 100);
})().catch((error) => {
  document.title = "FAIL";
  document.querySelector("#result").textContent = `RESULT=FAIL\nerror=${error.name}`;
});
</script>
